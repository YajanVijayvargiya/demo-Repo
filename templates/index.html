<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Buyer/Seller Portal</title>
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>
	<div class="container">
		<h1>Marketplace Demo</h1>

		<section id="role-select">
			<h2>Select your role</h2>
			<div class="role-buttons">
				<button id="buyerBtn">Buyer</button>
				<button id="sellerBtn">Seller</button>
			</div>
		</section>

		<section id="buyerSection" class="hidden">
			<h2>Browse Products</h2>
			<div id="productsList" class="cards"></div>

			<h3>Place an Order</h3>
			<form id="orderForm">
				<label>
					Your name
					<input type="text" id="buyerName" required>
				</label>
				<label>
					Product
					<select id="productSelect" required></select>
				</label>
				<label>
					Quantity
					<input type="number" id="quantity" min="1" required>
				</label>
				<button type="submit">Place order</button>
			</form>
			<div id="orderFeedback" class="feedback"></div>
		</section>

		<section id="sellerSection" class="hidden">
			<h2>Orders</h2>
			<div id="ordersList" class="table"></div>

			<h2>Update Inventory</h2>
			<form id="stockForm">
				<label>
					Product
					<select id="stockProductSelect" required></select>
				</label>
				<label>
					New stock
					<input type="number" id="newStock" min="0" required>
				</label>
				<button type="submit">Update stock</button>
			</form>
			<div id="stockFeedback" class="feedback"></div>
		</section>
	</div>

	<script src="/static/app.js"></script>
</body>
</html>
